<script>
    const bairro = prompt("Bairro de Entrega:   ").trim().toLowerCase();
    let taxaEntrega;
// ".trim()" irá tirar espaço em branco
//".toLowerCase()" não importa se usar masiculo ou minusculo. 
    switch (bairro) {
        case "centro":
            taxaEntrega = 5.00            
            break;
        case "rau":
        case "amizade":
            taxaEntrega = 7.00;
            break;
        case "vieira":
            taxaEntrega = 10.00;
            break;    
        default:
            taxaEntrega = 8.00;
            break;
    }
    alert(`Taxa R$: ${taxaEntrega.toFixed(2)}`)
</script>
