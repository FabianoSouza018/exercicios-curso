<script>

    const numero = Number(prompt("Digite um numero para verificar si PAR/IMPAR.:   ").trim());

    let resultado;

    if (numero % 2 === 0) {
        resultado = "Par"
    } else {
        resultado = "Impar"
    }

    alert(`Numero: ${numero} e ${resultado}`);
