<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio HTML + JS</title>
</head>
<body>
    <h1>Farmácia Preço Bom</h1>
    <form>
        <p>
            Nome do Medicamento:
            <input type="text" id="inMedicamento" required>
        </p>
        <p>
            Valor R$:
            <input type="number" id="inValor"  min="0" step="0.01" required>
        </p>
        <p>
        <input type="submit" value="Promocao leve 2 por apenas">
        </p>

    </form>
    <h3 id="outMedicamento"></h3>
    <h3 id="outPromocao"></h3>
    <script src="./js/farmacia.js"></script>
    
</body>
</html>
